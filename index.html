<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>IronGlass Lens Quiz</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="startScreen" class="card start-card">
      <div class="eyebrow">TVL Rental / IronGlass</div>
      <h1>Lens Quiz</h1>
      <p class="intro">
        Think you can recognize vintage glass? You’ll get 10 random images.
        Guess the lens, focal length and, if you dare, the T-stop.
      </p>

      <div class="difficulty-grid">
        <label class="difficulty-card">
          <input type="radio" name="difficulty" value="easy" checked />
          <span>
            <strong>Easy</strong>
            <small>Guess the lens only</small>
          </span>
        </label>

        <label class="difficulty-card">
          <input type="radio" name="difficulty" value="medium" />
          <span>
            <strong>Medium</strong>
            <small>Lens + focal length</small>
          </span>
        </label>

        <label class="difficulty-card">
          <input type="radio" name="difficulty" value="hard" />
          <span>
            <strong>Hard</strong>
            <small>Lens + focal length + T-stop</small>
          </span>
        </label>
      </div>

      <button id="startButton" class="main-button">Start quiz</button>
    </section>

    <section id="quizScreen" class="card quiz-card hidden">
      <div class="quiz-top">
        <div>
          <div class="eyebrow" id="quizEyebrow">IronGlass Lens Quiz</div>
          <h2 id="roundTitle">Round 1 / 10</h2>
        </div>

        <div class="score-pill">
          Score: <span id="liveScore">0</span>
        </div>
      </div>

      <div class="image-wrap">
        <div id="imageLoader" class="image-loader">Loading image...</div>
        <img id="quizImage" alt="Lens quiz image" />
      </div>

      <div class="answer-grid">
        <label>
          <span>Which lens?</span>
          <select id="lensSelect"></select>
        </label>

        <label id="focalField">
          <span>Which focal length?</span>
          <select id="focalSelect"></select>
        </label>

        <label id="tstopField">
          <span>Which T-stop?</span>
          <select id="tstopSelect"></select>
        </label>
      </div>

      <div class="button-row">
        <button id="checkButton" class="main-button">Check answer</button>
        <button id="nextButton" class="secondary-button hidden">Next image</button>
      </div>

      <div id="feedbackBox" class="feedback hidden"></div>
    </section>

    <section id="resultScreen" class="card result-card hidden">
      <div class="eyebrow">Quiz complete</div>
      <h1 id="resultTitle">Your score</h1>
      <p id="resultText"></p>

      <div id="breakdownBox" class="breakdown"></div>

      <button id="restartButton" class="main-button">Play again</button>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js?v=20"></script>
</body>
</html>
